apply plugin: 'com.android.application'

android {
    namespace 'com.ppma.filemanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.ppma.jadx"
        // jadx 1.5.6 使用 java.nio.file 等新 API，最低需要 Android 8.0 (API 26)
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName "1.1"
        multiDexEnabled true
    }

    // release 直接用 debug 签名（AGP 会自动生成 debug.keystore，CI 上也能跑）
    // 这样产出的 release 包可以直接安装，同时 debuggable=false
    signingConfigs {
        release {
            initWith signingConfigs.debug
        }
    }

    buildTypes {
        release {
            // 关键：release 必须 debuggable=false，否则 Android 会强制开 CheckJNI，
            // 遇到非 UTF-8 文件名（NewStringUTF 非法字节）时会直接 SIGABRT 闪退
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/ASL2.0',
                         'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                         'META-INF/versions/9/module-info.class',
                         'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // 本地 libs：jadx-1.5.6.jar（裁剪版 jadx-core：api/core/zip/plugins + 其依赖）
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.yanzhenjie:permission:1.0.4'
    implementation 'com.fifesoft:rsyntaxtextarea:2.5.8'
    implementation project(':codeview')
    implementation 'com.github.bmelnychuk:atv:1.2.9'

    // 注意：slf4j / commons-io / org.jetbrains.annotations 已随 jadx jar 提供，
    // 不能再单独引入，否则会 Duplicate class 冲突
}