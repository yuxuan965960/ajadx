apply plugin: 'com.android.library'

android {
    namespace 'com.ppma.jadx'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:28.0.0'
    runtimeOnly files('clsp-data/android-5.1.jar')
    implementation files('lib/dx-1.10.jar')
    implementation files('clsp-data/android-5.1.jar')
    implementation 'org.slf4j:slf4j-api:1.7.10'
    implementation 'commons-io:commons-io:2.4'
    implementation 'org.ow2.asm:asm:5.0.3'
    implementation 'com.intellij:annotations:12.0'
    implementation 'uk.com.robust-it:cloning:1.9.2'
}
